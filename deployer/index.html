<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>
    
    <div class="container">
        <h2>Deployer Dashboard</h2>
        <div class="input-group">
            <input type="text" id="repo-url" placeholder="https://github.com/username/repo.git" required>
        </div>
        <button id="deploy-btn" onclick="startDeployment()">Initiate Deployment</button>
        
        <hr class="separator">

        <h2>Database Engine</h2>
        <div class="input-group">
            <input type="text" id="db-name" placeholder="Enter new database name (e.g. ios_app_db)">
        </div>
        <button id="db-btn" onclick="provisionDatabase()">Provision Database</button>

        <div id="terminal" class="terminal">
            <div id="output">System Ready. Awaiting coordinates.</div>
        </div>
    </div>

    <!-- Deployment Popup Modal -->
    <div id="success-popup" class="popup-modal">
        <div class="popup-content">
            <h3>Deployment Successful</h3>
            <p>Your project is now live on the server.</p>
            <a id="project-link" href="#" target="_blank" class="popup-btn">Open Deployment</a>
            <button onclick="closePopup()" class="popup-btn popup-btn-close">Close</button>
        </div>
    </div>

    <!-- DB Instructions Popup Modal -->
    <div id="db-popup" class="popup-modal">
        <div class="popup-content" style="max-width: 600px; text-align: left;">
            <h3 style="text-align: center;">Database Activated</h3>
            <p style="text-align: center;">Your database <strong id="created-db-name" style="color: #66fcf1;"></strong> is ready. Connect using the credentials below:</p>
            <div class="terminal" style="height: 200px; margin-top: 15px;">
                <div id="db-instructions" style="white-space: pre; color: #a8ffb2;"></div>
            </div>
            <button onclick="closeDbPopup()" class="popup-btn popup-btn-close" style="width: 100%; text-align: center;">Acknowledge</button>
        </div>
    </div>

    <script>
        function showPopup(url) {
            document.getElementById('project-link').href = url;
            document.getElementById('success-popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('success-popup').style.display = 'none';
        }
        
        function closeDbPopup() {
            document.getElementById('db-popup').style.display = 'none';
        }

        async function provisionDatabase() {
            const dbName = document.getElementById('db-name').value;
            const output = document.getElementById('output');
            
            if (!dbName) {
                alert("Please enter a database name");
                return;
            }

            output.innerHTML += `[DB] Provisioning database: ${dbName}...<br>`;
            output.parentElement.scrollTop = output.parentElement.scrollHeight;
            
            try {
                const formData = new FormData();
                formData.append('db_name', dbName);
                
                const response = await fetch('provision_db.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    output.innerHTML += `[DB-SUCCESS] ${result.message}<br>`;
                    document.getElementById('created-db-name').innerText = dbName;
                    
                    const codeBlock = `// --- MAMP Server PHP Connection Boilerplate ---\n\n$host = 'localhost';\n$port = '8889';\n$dbname = '${dbName}';\n$user = 'root';\n$pass = 'root';\n\ntry {\n    $dsn = "mysql:host=$host;port=$port;dbname=$dbname;charset=utf8mb4";\n    $pdo = new PDO($dsn, $user, $pass, [\n        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION\n    ]);\n    // Connection successful\n} catch (PDOException $e) {\n    die("DB Error: " . $e->getMessage());\n}`;
                    
                    document.getElementById('db-instructions').innerText = codeBlock;
                    document.getElementById('db-popup').style.display = 'flex';
                } else {
                    output.innerHTML += `[DB-FAILED] ${result.message}<br>`;
                }
            } catch (err) {
                output.innerHTML += `[DB-ERROR] Connection to DB provisioning failed.<br>`;
            }
            output.parentElement.scrollTop = output.parentElement.scrollHeight;
        }

        function startDeployment() {
            const repoUrl = document.getElementById('repo-url').value;
            const output = document.getElementById('output');
            const deployBtn = document.getElementById('deploy-btn');
            
            if (!repoUrl) {
                alert("Please enter a repository URL");
                return;
            }

            deployBtn.disabled = true;
            output.innerHTML = 'Establishing secure link via ZeroTier tunnel...<br>';

            // Open Server-Sent Events connection
            const eventSource = new EventSource('deploy.php?repo=' + encodeURIComponent(repoUrl));

            eventSource.onmessage = function(event) {
                const message = event.data;
                output.innerHTML += message + '<br>';
                output.parentElement.scrollTop = output.parentElement.scrollHeight;

                if (message.includes('Deployment Complete') || message.includes('Deployment Failed')) {
                    eventSource.close();
                    deployBtn.disabled = false;
                    
                    if (message.includes('Deployment Complete')) {
                        // Extract repo name to build the URL
                        const parts = repoUrl.split('/');
                        let repoName = parts[parts.length - 1].replace('.git', '').replace(/[^a-zA-Z0-9_-]/g, '');
                        // The server runs on port 8888
                        const projectUrl = `http://10.247.192.231:8888/${repoName}/`;
                        showPopup(projectUrl);
                    }
                }
            };

            eventSource.onerror = function() {
                output.innerHTML += '<span style="color:#ff4c4c;">Connection lost.</span><br>';
                eventSource.close();
                deployBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
